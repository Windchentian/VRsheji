<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe AR Project - Step 2.5 Fix</title>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
            color: #fff;
            font-family: sans-serif;
            margin-top: calc(env(safe-area-inset-top) + 10px);
        }
        .status {
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="status" id="status-text">📷 正在启动相机...</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let hands = null;
        let cameraActive = false;

        // 第一步：雷打不动先让摄像头跑起来
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    cameraActive = true;
                    statusText.textContent = "📷 相机已就绪，正在后台加载 AI 核心...";
                    statusText.style.background = "rgba(255, 140, 0, 0.7)"; // 变成橙色提示开始载入AI
                    // 相机画面出来后，再开始慢慢加载 AI，防止互相抢占资源导致黑屏
                    initAI();
                };
            } catch (err) {
                statusText.textContent = "🔴 相机启动失败: " + err.message;
                statusText.style.background = "rgba(128, 0, 0, 0.7)";
            }
        }

        // 第二步：相机平稳运行后，再去加载 AI 引擎
        function initAI() {
            try {
                // 如果发现 MediaPipe 库在全局不存在，说明CDN本身断联
                if (typeof Hands === 'undefined') {
                    statusText.textContent = "❌ 加载组件超时，请刷新网页重试";
                    return;
                }

                hands = new Hands({
                    locateFile: (file) => {
                        // 强制改用完全不受区域限制的高稳定 CDN 路径
                        return `https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424510/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });

                hands.onResults(onResults);
                
                // 启动循环监听机制
                predictLoop();

            } catch (e) {
                statusText.textContent = "🔴 AI 模块异常: " + e.message;
            }
        }

        // 核心运算循环
        async function predictLoop() {
            if (cameraActive && video.readyState >= video.HAVE_CURRENT_DATA && hands) {
                try {
                    await hands.send({image: video});
                } catch (err) {
                    // 默默忽略单帧抖动产生的运算错误
                }
            }
            // 保持每秒60帧的节奏循环检查
            requestAnimationFrame(predictLoop);
        }

        // AI 成功吐出结果后的渲染
        let firstFrameDetected = false;
