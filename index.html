<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe AR Project - Step 2 (Speed Up)</title>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
            color: #fff;
            font-family: sans-serif;
            margin-top: calc(env(safe-area-inset-top) + 10px);
        }
        .status {
            font-size: 0.9rem;
            background: rgba(255, 140, 0, 0.7); /* 橙色代表加载中 */
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }
        #debug-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ff3b30;
            padding: 10px;
            font-size: 0.8rem;
            border-radius: 5px;
            max-width: 80%;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="status" id="status-text">🚀 正在通过国内加速节点加载 AI 模型...</div>
    </div>

    <div id="debug-log" id="log-box"></div>

    <script>
        const video = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');
        const logBox = document.getElementById('debug-log');

        function showDebug(msg) {
            logBox.style.display = 'block';
            logBox.innerHTML += msg + '<br>';
        }

        // 初始化 MediaPipe Hands，同样定向到国内加速 CDN 文件
        const hands = new Hands({
            locateFile: (file) => {
                return `https://fastly.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // 标记 AI 是否已经收到了第一帧结果
        let aiReady = false;

        function onResults(results) {
            if (!aiReady) {
                aiReady = true;
                statusText.textContent = "AI 追踪已就绪 (高速模式) 🟢";
                statusText.style.background = "rgba(0, 128, 0, 0.6)";
            }

            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 4});
                }
            }
            canvasCtx.restore();
        }

            const constraints = {
                audio: false,
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },

                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
