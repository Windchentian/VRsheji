<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe AR - iOS Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        #particle_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }
        #ui-layer {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 10px);
            left: 0;
            width: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        .status {
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* 报错收集箱 */
        #debug-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #ff3b30;
            padding: 10px;
            font-size: 0.8rem;
            border-radius: 5px;
            z-index: 100;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <canvas id="particle_canvas"></canvas>

    <div id="ui-layer">
        <div class="status" id="status-text">🔄 正在唤醒摄像头...</div>
    </div>

    <div id="debug-box"></div>

    <script>
        // 实时监控是否有代码死掉，直接显示在手机上
        window.onerror = function(msg, url, line) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.innerHTML += `脚本奔溃: ${msg} (第${line}行)<br>`;
            return false;
        };

        const video = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');

        // ----------------- 1. 强力破除 iOS 黑屏 -----------------
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: { ideal: "environment" } }
                });
                video.srcObject = stream;
                
                // 【核心修复】强行命令视频播放，踢开 iOS 标志性的黑屏
                await video.play();
                
                statusText.textContent = "✨ 魔法场已连通！请划动屏幕";
                statusText.style.background = "rgba(0, 128, 0, 0.6)";
            } catch (err) {
                statusText.textContent = "❌ 相机启动失败: " + err.message;
                statusText.style.background = "rgba(128, 0, 0, 0.6)";
            }
        }

        // ----------------- 2. 丝滑粒子系统 -----------------
        const canvas = document.getElementById('particle_canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        const colors = ['#00ffff', '#ff00ff', '#ffff00', '#ffffff', '#00ffaa'];

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                const baseSpeed = isExplosion ? (Math.random() * 12 + 4) : (Math.random() * 2 - 1);
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * baseSpeed;
                this.vy = Math.sin(angle) * baseSpeed;
                this.size = Math.random() * 4 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
